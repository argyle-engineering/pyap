[build-system]
requires = ["hatchling>=1.33.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "pyap2"
dynamic = ["version"]
description = "A maintained, typed fork of pyap for parsing US, CA, and UK addresses"
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Argyle Developers", email = "developers@argyle.io" },
]
keywords = ["address", "parser", "regex"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/argyle-engineering/pyap"
Homepage = "https://github.com/argyle-engineering/pyap"
Repository = "https://github.com/argyle-engineering/pyap"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "taskipy>=1.14.1",
    "yamllint>=1.38.0",
]

[tool.uv]
required-version = ">=0.13.7"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["pyap"]

[tool.hatch.build.targets.sdist]
include = [
    "/AUTHORS.rst",
    "/LICENSE",
    "/README.rst",
    "/pyap",
    "/pyproject.toml",
    "/tests",
    "/uv.lock",
]

[tool.taskipy.tasks]
lint = "ruff check . && yamllint ."
check_types = "pyright"
check_fmt = "ruff format --check ."
fmt = "ruff format . && ruff check . --fix"
test = "pytest tests -vvv"
check = "task lint && task check_fmt && task check_types && task test"

[tool.pyright]
pythonVersion = "3.11"
reportIncompatibleVariableOverride = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportUnusedImport = true
reportDuplicateImport = true
reportWildcardImportFromLibrary = true
reportOptionalMemberAccess = true
reportUntypedBaseClass = true
reportPrivateUsage = true
reportUntypedClassDecorator = true
reportConstantRedefinition = true
reportInvalidTypeVarUse = true
reportUnnecessaryIsInstance = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportAssertAlwaysTrue = true
reportUnusedCoroutine = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F"]

[tool.ruff.lint.per-file-ignores]
"pyap/source_*/*" = ["E501", "F522", "W291", "W293"]
