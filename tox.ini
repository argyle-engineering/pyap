# Run the test suite in an isolated env (optional; Poetry is the primary workflow).
# From the repo root: tox
# Matches CI test command: poetry run task test  ->  pytest tests -vvv

[tox]
envlist = py39
requires = tox>=4
skip_missing_interpreters = true

[testenv]
description = pytest against tests/ (package installed editable via Poetry)
skip_install = true
allowlist_externals =
    poetry
commands_pre =
    poetry install --no-interaction --sync
commands =
    poetry run pytest tests -vvv
