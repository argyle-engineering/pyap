name: Publish to Test PyPi

on:  # yamllint disable-line rule:truthy
  pull_request:
    types:
    - labeled
    - opened
    - synchronize
  workflow_dispatch:

jobs:
  build:
    if: |
      contains( github.event.pull_request.labels.*.name, 'publish-pr') ||
      contains( github.event.pull_request.labels.*.name, 'build-pr')
    name: Build package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
        python-version: "3.12"
    - name: Build Python package
      run: uv build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v7.0.2
      with:
        name: python-package-distributions
        path: dist/

  publish-to-testpypi:
    if: contains( github.event.pull_request.labels.*.name, 'publish-pr')
    name: Publish package to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyap2

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v8.0.2
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
